name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Packer releases require stable vMAJOR.MINOR.PATCH tags'
            exit 1
          fi
          go test ./...
          go vet ./...
      - name: Read SDK protocol version
        run: echo "API_VERSION=$(go run . describe | jq -r .api_version)" >> "$GITHUB_ENV"
      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/v')
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.20.0
      - name: Package snapshot
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: goreleaser release --snapshot --skip=publish,sign --clean
      - name: Create signed draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: goreleaser release --clean
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            dist/*.zip
            dist/*SHA256SUMS*
